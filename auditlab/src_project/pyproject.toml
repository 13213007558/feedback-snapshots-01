[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditdemo"
version = "1.0.0"
description = "Tiny wheel for install provenance auditing"
requires-python = ">=3.9"

# Entry-point declaration: the installer GENERATES a launcher from this.
# No file named "audited-entry" exists inside the wheel.
[project.scripts]
audited-entry = "auditdemo.core:main"

[tool.setuptools]
packages = ["auditdemo"]

[tool.setuptools.package-data]
auditdemo = ["data.txt"]
